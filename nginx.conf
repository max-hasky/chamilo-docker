server {
    listen 80;
    server_name localhost;
    root /var/www/chamilo/public;
    index index.php;

    # Увеличиваем лимит загрузки для курсов и видео (из вашего старого конфига)
    client_max_body_size 200M;

    # Заголовки безопасности из официальной инструкции
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Блокировка скрытых файлов (.env, .git) кроме Let's Encrypt
    location ~ /\.(?!well-known) {
        deny all;
    }

    # -----------------------------------------------------------------------
    # Чисто статические директории Chamilo 3
    # -----------------------------------------------------------------------
    location ~* ^/(build|bundles|documentation|fonts|img|libs|sound)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Дополнительное кэширование общих медиа-файлов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires max;
        log_not_found off;
        access_log off;
    }

    # -----------------------------------------------------------------------
    # Старые ветки PHP — /main/ и /plugin/ выполняют файлы напрямую
    # -----------------------------------------------------------------------
    location ~ ^/(main|plugin)/ {
        try_files $uri $uri/ =404;

        location ~ \.php$ {
            # Адаптировано под Docker: перенаправляем на порт 9000 контейнера chamilo-app
            fastcgi_pass  chamilo-app:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include       fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $realpath_root;
            fastcgi_param PATH_INFO       $fastcgi_path_info;

            fastcgi_read_timeout 300s;
        }
    }

    # -----------------------------------------------------------------------
    # Фронт-контроллер Symfony
    # -----------------------------------------------------------------------
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # -----------------------------------------------------------------------
    # check.php — Проверка соответствия системным требованиям Symfony
    # -----------------------------------------------------------------------
    location = /check.php {
        deny all;
    }

    # -----------------------------------------------------------------------
    # legacy.php — Внутренний загрузчик старого кода. Должен быть закрыт снаружи
    # -----------------------------------------------------------------------
    location = /legacy.php {
        deny all;
    }

    # -----------------------------------------------------------------------
    # Выполнение PHP — Только точка входа Symfony (index.php)
    # -----------------------------------------------------------------------
    location ~ ^/index\.php$ {
        # Адаптировано под Docker: перенаправляем на порт 9000 контейнера chamilo-app
        fastcgi_pass  chamilo-app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        internal;
        fastcgi_read_timeout 300s;
    }

    # Запрещаем прямой доступ к любым другим .php файлам в корневом уровне
    location ~ \.php$ {
        return 404;
    }
}
